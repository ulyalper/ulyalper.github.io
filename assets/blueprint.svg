<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <g stroke="#cdbfa3" stroke-width="1.4" fill="none" opacity="0.9">
    <!-- High-rise tower -->
    <rect x="120" y="240" width="170" height="520"/>
    <line x1="120" y1="300" x2="290" y2="300"/>
    <line x1="120" y1="360" x2="290" y2="360"/>
    <line x1="120" y1="420" x2="290" y2="420"/>
    <line x1="120" y1="480" x2="290" y2="480"/>
    <line x1="120" y1="540" x2="290" y2="540"/>
    <line x1="120" y1="600" x2="290" y2="600"/>
    <line x1="120" y1="660" x2="290" y2="660"/>
    <line x1="120" y1="720" x2="290" y2="720"/>
    <line x1="175" y1="240" x2="175" y2="760"/>
    <line x1="235" y1="240" x2="235" y2="760"/>
    <!-- rooftop detail -->
    <rect x="170" y="200" width="70" height="40"/>
    <line x1="205" y1="160" x2="205" y2="200"/>

    <!-- Mid-rise stepped building -->
    <path d="M360 760 L360 460 L470 460 L470 380 L600 380 L600 760 Z"/>
    <line x1="360" y1="520" x2="600" y2="520"/>
    <line x1="360" y1="580" x2="600" y2="580"/>
    <line x1="360" y1="640" x2="600" y2="640"/>
    <line x1="360" y1="700" x2="600" y2="700"/>
    <line x1="420" y1="460" x2="420" y2="760"/>
    <line x1="480" y1="380" x2="480" y2="760"/>
    <line x1="540" y1="380" x2="540" y2="760"/>

    <!-- Wide commercial block -->
    <rect x="680" y="520" width="320" height="240"/>
    <line x1="680" y1="580" x2="1000" y2="580"/>
    <line x1="680" y1="640" x2="1000" y2="640"/>
    <line x1="680" y1="700" x2="1000" y2="700"/>
    <line x1="760" y1="520" x2="760" y2="760"/>
    <line x1="840" y1="520" x2="840" y2="760"/>
    <line x1="920" y1="520" x2="920" y2="760"/>
    <!-- entrance canopy -->
    <path d="M790 760 L790 730 L890 730 L890 760"/>

    <!-- Tall slim tower -->
    <rect x="1080" y="300" width="130" height="460"/>
    <line x1="1080" y1="360" x2="1210" y2="360"/>
    <line x1="1080" y1="420" x2="1210" y2="420"/>
    <line x1="1080" y1="480" x2="1210" y2="480"/>
    <line x1="1080" y1="540" x2="1210" y2="540"/>
    <line x1="1080" y1="600" x2="1210" y2="600"/>
    <line x1="1080" y1="660" x2="1210" y2="660"/>
    <line x1="1080" y1="720" x2="1210" y2="720"/>
    <line x1="1145" y1="300" x2="1145" y2="760"/>

    <!-- Ground line -->
    <line x1="40" y1="760" x2="1360" y2="760" stroke-width="1.8"/>

    <!-- Dimension / construction lines -->
    <line x1="120" y1="180" x2="290" y2="180" stroke-dasharray="6 8"/>
    <line x1="120" y1="172" x2="120" y2="188"/>
    <line x1="290" y1="172" x2="290" y2="188"/>
    <line x1="1080" y1="260" x2="1210" y2="260" stroke-dasharray="6 8"/>
    <line x1="1080" y1="252" x2="1080" y2="268"/>
    <line x1="1210" y1="252" x2="1210" y2="268"/>

    <!-- Faint section circle detail -->
    <circle cx="700" cy="200" r="60" stroke-dasharray="4 6"/>
    <line x1="640" y1="200" x2="760" y2="200"/>
    <line x1="700" y1="140" x2="700" y2="260"/>
  </g>
</svg>
